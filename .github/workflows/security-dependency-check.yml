name: Security dependency verification
"on":
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: yenisi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install committed dependency lock
        id: install
        run: npm ci --no-audit --no-fund
      - name: Audit every severity
        if: always() && steps.install.outcome == 'success'
        run: npm audit --audit-level=low
      - name: Check Browserslist behavior without prototype mutation
        if: always() && steps.install.outcome == 'success'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import browserslist from 'browserslist';
          const before = Object.getOwnPropertyDescriptors(Object.prototype);
          const browsers = browserslist('last 2 Chrome versions');
          assert.equal(browsers.length, 2);
          assert(browsers.every(value => /^chrome \d+$/.test(value)));
          assert.deepEqual(Object.getOwnPropertyDescriptors(Object.prototype), before);
          console.log('Browserslist query and prototype-preservation regression checks passed.');
          JS
      - name: Build production application
        id: build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
      - name: Independent TypeScript check
        if: always() && steps.install.outcome == 'success'
        run: npm exec --no -- tsc --noEmit
      - name: Verify compiled brand colors and responsive styles
        if: always() && steps.build.outcome == 'success'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const css=fs.readdirSync('dist/assets').filter(p=>p.endsWith('.css')).map(p=>fs.readFileSync(`dist/assets/${p}`,'utf8')).join('\n');
          assert(css.includes('.text-swedish-blue'));
          assert(css.includes('.bg-gray-50'));
          assert(css.includes('grid-template-columns:repeat(2'));
          assert(!/@tailwind\s/.test(css));
          console.log('Compiled brand and responsive style checks passed.');
          JS
      - name: Check separate PHP entry point syntax without executing it
        run: php -l ../php-version/index.php
      - name: Ensure dependency lock and manifest did not drift
        if: always() && steps.install.outcome == 'success'
        run: git diff --exit-code -- package-lock.json package.json
